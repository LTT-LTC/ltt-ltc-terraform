---
- name: Check if Swarm is already joined
  shell: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
  register: swarm_status
  changed_when: false

- name: Join Swarm as worker
  command: >
    docker swarm join
    --token {{ hostvars[groups['swarm_manager'][0]]['swarm_worker_token'] }}
    {{ hostvars[groups['swarm_manager'][0]]['inventory_hostname'] }}:2377
  when: swarm_status.stdout != "active"
