name: BE — dispatch CI / deploy

on:
  repository_dispatch:
    types: [be_ci, be_deploy]

jobs:
  ci:
    uses: ./.github/workflows/reusable-be-ci.yml
    with:
      repository: ${{ github.event.client_payload.repository }}
      ref: ${{ github.event.client_payload.ref }}
    secrets:
      checkout_token: ${{ secrets.WORKFLOW_CHECKOUT_TOKEN }}

  deploy:
    needs: ci
    if: ${{ github.event.action == 'be_deploy' && github.event.client_payload.deploy == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.WORKFLOW_CHECKOUT_TOKEN }}

      - name: Resolve image / Dockerfile / compose service
        id: meta
        env:
          REPO_FULL: ${{ github.event.client_payload.repository }}
          OWNER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          case "$REPO_FULL" in
            */ltt-ltc-administration-api)
              echo "dockerfile=LTC.AdministrationService.HttpApi.Host/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "compose=ltt-ltc-administration-api" >> "$GITHUB_OUTPUT"
              echo "image=${OWNER}/ltt-ltc-administration-api" >> "$GITHUB_OUTPUT"
              ;;
            */ltt-ltc-customer-api)
              echo "dockerfile=LTC.CustomerService.HttpApi.Host/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "compose=ltt-ltc-customer-api" >> "$GITHUB_OUTPUT"
              echo "image=${OWNER}/ltt-ltc-customer-api" >> "$GITHUB_OUTPUT"
              ;;
            */ltt-ltc-movie-service)
              echo "dockerfile=LTC.MovieService.HttpApi.Host/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "compose=ltt-ltc-movie-api" >> "$GITHUB_OUTPUT"
              echo "image=${OWNER}/ltt-ltc-movie-api" >> "$GITHUB_OUTPUT"
              ;;
            */ltt-ltc-product-api)
              echo "dockerfile=LTC.ProductService.HttpApi.Host/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "compose=ltt-ltc-product-api" >> "$GITHUB_OUTPUT"
              echo "image=${OWNER}/ltt-ltc-product-api" >> "$GITHUB_OUTPUT"
              ;;
            */ltt-ltc-payment-api)
              echo "dockerfile=LTC.PaymentService.HttpApi.Host/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "compose=ltt-ltc-payment-api" >> "$GITHUB_OUTPUT"
              echo "image=${OWNER}/ltt-ltc-payment-api" >> "$GITHUB_OUTPUT"
              ;;
            */ltt-ltc-web-gateway)
              echo "dockerfile=LTC.WebGateWay/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "compose=ltt-ltc-web-gateway" >> "$GITHUB_OUTPUT"
              echo "image=${OWNER}/ltt-ltc-web-gateway" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported repository: $REPO_FULL"
              exit 1
              ;;
          esac

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -f "${{ steps.meta.outputs.dockerfile }}" -t "${{ steps.meta.outputs.image }}":latest .
          docker push "${{ steps.meta.outputs.image }}":latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Swarm via SSH
        env:
          COMPOSE_SERVICE: ${{ steps.meta.outputs.compose }}
          IMAGE_NAME: ${{ steps.meta.outputs.image }}
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} << EOF
            set -e
            echo "Updating ${COMPOSE_SERVICE} service in Docker Swarm..."
            docker service update --image ${IMAGE_NAME}:latest --force ltt-ltc-db_${COMPOSE_SERVICE}
            echo "Deployment complete!"
            docker service ps ltt-ltc-db_${COMPOSE_SERVICE}
          EOF
