name: FE — dispatch CI / deploy

on:
  repository_dispatch:
    types: [fe_ci, fe_deploy]

jobs:
  ci:
    uses: ./.github/workflows/reusable-fe-ci.yml
    with:
      repository: ${{ github.event.client_payload.repository }}
      ref: ${{ github.event.client_payload.ref }}
    secrets:
      checkout_token: ${{ secrets.WORKFLOW_CHECKOUT_TOKEN }}

  deploy:
    needs: ci
    if: ${{ github.event.action == 'fe_deploy' && github.event.client_payload.deploy == true }}
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ltt-ltc-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.WORKFLOW_CHECKOUT_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Swarm via SSH
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} << EOF
            set -e
            echo "Updating ltt-ltc-web-app service in Docker Swarm..."
            docker service update --image $IMAGE_NAME:latest --force ltt-ltc_ltt-ltc-web-app
            echo "Deployment complete!"
            docker service ps ltt-ltc_ltt-ltc-web-app
          EOF
