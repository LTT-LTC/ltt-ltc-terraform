name: Deploy to Docker Swarm

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, web-app, administration-api, customer-api, movie-api, product-api, payment-api, web-gateway)'
        required: true
        default: 'all'
      image_tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Swarm
        env:
          SERVICE: ${{ github.event.inputs.service }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} << EOF
            set -e
            
            deploy_service() {
              local service_name=$1
              local image_name=$2
              echo "Updating service: $service_name"
              docker service update --image ${DOCKER_USERNAME}/${image_name}:${IMAGE_TAG} --force ltt-ltc_${service_name}
            }
            
            if [ "$SERVICE" = "all" ]; then
              echo "Updating all services..."
              deploy_service "ltt-ltc-web-app" "ltt-ltc-web-app"
              deploy_service "ltt-ltc-web-gateway" "ltt-ltc-web-gateway"
              deploy_service "ltt-ltc-administration-api" "ltt-ltc-administration-api"
              deploy_service "ltt-ltc-customer-api" "ltt-ltc-customer-api"
              deploy_service "ltt-ltc-movie-api" "ltt-ltc-movie-api"
              deploy_service "ltt-ltc-product-api" "ltt-ltc-product-api"
              deploy_service "ltt-ltc-payment-api" "ltt-ltc-payment-api"
            else
              case "$SERVICE" in
                web-app)
                  deploy_service "ltt-ltc-web-app" "ltt-ltc-web-app"
                  ;;
                administration-api)
                  deploy_service "ltt-ltc-administration-api" "ltt-ltc-administration-api"
                  ;;
                customer-api)
                  deploy_service "ltt-ltc-customer-api" "ltt-ltc-customer-api"
                  ;;
                movie-api)
                  deploy_service "ltt-ltc-movie-api" "ltt-ltc-movie-api"
                  ;;
                product-api)
                  deploy_service "ltt-ltc-product-api" "ltt-ltc-product-api"
                  ;;
                payment-api)
                  deploy_service "ltt-ltc-payment-api" "ltt-ltc-payment-api"
                  ;;
                web-gateway)
                  deploy_service "ltt-ltc-web-gateway" "ltt-ltc-web-gateway"
                  ;;
                *)
                  echo "Unknown service: $SERVICE"
                  exit 1
                  ;;
              esac
            fi
            
            echo "Deployment complete!"
            docker service ls
          EOF
